name: GitHub Classroom Workflow

on:
  workflow_dispatch:
  push:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  Checking-Solution:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          g++ --version

      - name: Build
        run: make

      - name: Autograding
        uses: amcp-pit/autograding@v1

      - name: Memory leaks
        run: |
          valgrind \
            --tool=memcheck \
            --leak-check=full \
            --undef-value-errors=no \
            --error-exitcode=111 \
            ./tests_runner

      - name: CPD
        uses: amcp-pit/cpd-action@v1
        id: cpd
        with:
          repository: ${{ github.repository }}
          collection: ${{ github.repository_owner }}

      - name: Clean
        run: |
          make clean